name: aws-s3

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "infra/bootstrap/**"
      - "infra/ec2-site/**"
      - ".github/workflows/aws-ec2.yml"
      - ".github/workflows/netlify.yml"
      - ".github/workflows/supabase.yml"
      - "supabase/**"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "infra/bootstrap/**"
      - "infra/ec2-site/**"
      - ".github/workflows/aws-ec2.yml"
      - ".github/workflows/netlify.yml"
      - ".github/workflows/supabase.yml"
      - "supabase/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: aws-s3-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_VAR_project: ${{ vars.PROJECT }}
  TF_IN_AUTOMATION: "true"
  # Yayınlanacak klasör. Build varsa çıktısı (Astro/Vite: dist).
  PUBLISH_DIR: site

defaults:
  run:
    shell: bash
    working-directory: infra/s3-site

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1

      - run: terraform fmt -check -recursive

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=eu-central-1"

      - run: terraform validate

      # Plan rolü salt okunur, kilit dosyası yazamaz; kilidi sadece apply alır.
      - run: terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: Planı PR'a yaz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "<!-- aws-s3-plan -->"
            echo "#### Terraform plan: S3 + CloudFront"
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo "<details><summary>Ayrıntı</summary>"
            echo
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > comment.md
          # Kendi işaretli yorumunu günceller; diğer workflow'ların yorumlarına dokunmaz.
          PR=${{ github.event.pull_request.number }}
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.body | startswith("<!-- aws-s3-plan -->")) | .id' | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (package.json varsa)
        working-directory: ${{ github.workspace }}
        run: if [ -f package.json ]; then npm ci && npm run build; fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=eu-central-1"

      - run: terraform apply -input=false -auto-approve

      - name: İçeriği yükle
        run: |
          BUCKET=$(terraform output -raw bucket)
          DIST=$(terraform output -raw distribution_id)
          aws s3 sync "$GITHUB_WORKSPACE/$PUBLISH_DIR/" "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" > /dev/null
          echo "### Yayında: $(terraform output -raw url)" >> "$GITHUB_STEP_SUMMARY"
